  </defs>
  
    <!-- Hải Phòng: Cảng biển & Hoa phượng đỏ -->
    <circle cx="60" cy="60" r="50" fill="#EFF6FF"/>
    <path d="M10 85 Q60 78 110 85 V105 H10 Z" fill="#1D4ED8"/>
